name: 更新航班数据

# 每 15 分钟定时抓取一次 OpenSky 数据（免费额度内，且足够画飞机轨迹）
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

concurrency:
  group: update-flights
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 OpenSky 航班数据
        run: python scripts/fetch_data.py
        continue-on-error: false

      - name: 提交数据更新
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@github.com"
          git add data/flights.json data/tracks.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新航班数据 $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "已更新并推送航班数据"
          else
            echo "数据无变化，跳过提交"
          fi