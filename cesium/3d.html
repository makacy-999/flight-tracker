<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 航班实时动态 · 冷链物流监控</title>
  <!-- Cesium 3D 引擎 (god-eye-view 同款3D渲染) -->
  <link href="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    :root {
      --bg:#0a0a0f; --panel:#131322; --panel2:#1a1a2e; --border:#26263d;
      --text:#e8eaf6; --muted:#8a8fb0; --accent:#1a73e8; --accent2:#23c9a0;
      --warn:#f59e0b;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body{height:100%}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--border);flex:0 0 auto}
    .brand{display:flex;align-items:center;gap:10px}
    .logo{font-size:26px}
    .topbar h1{font-size:17px;font-weight:600}
    .sub{font-size:12px;color:var(--muted);margin-top:2px}
    .badge{font-size:11px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:3px 9px;border-radius:16px}
    .layout{flex:1;display:flex;min-height:0}
    .left{width:360px;flex:0 0 360px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--panel);min-height:0}
    .mapwrap{flex:1;position:relative;background:#04040a}
    #cesiumContainer{position:absolute;inset:0}
    .search{padding:14px 16px;border-bottom:1px solid var(--border)}
    .search h2,.results h2{font-size:13px;color:var(--muted);margin-bottom:9px;font-weight:600}
    .searchrow{display:flex;gap:7px}
    input{flex:1;padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;outline:none}
    input:focus{border-color:var(--accent)}
    .btn{padding:9px 15px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:13px;cursor:pointer}
    .btn:hover{filter:brightness(1.1)}
    .hint{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.5}
    .refresh{display:flex;align-items:center;justify-content:space-between;margin-top:9px;font-size:11px;color:var(--muted)}
    .refresh label{display:flex;align-items:center;gap:5px;cursor:pointer}
    .gt{color:var(--accent2)}
    .status{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
    .status.ok{color:var(--accent2)} .status.error{color:#ea4335} .status.loading{color:var(--accent)}
    .results{flex:1;display:flex;flex-direction:column;min-height:0}
    .reshead{display:flex;align-items:center;justify-content:space-between;padding:11px 16px 7px}
    .reshead h2{margin:0;display:flex;align-items:center;gap:7px}
    .cnt{background:var(--accent);color:#fff;border-radius:11px;padding:0 7px;font-size:11px}
    .list{flex:1;overflow-y:auto;padding:0 11px 11px}
    .empty{color:var(--muted);font-size:12px;text-align:center;padding:22px 8px;line-height:1.8}
    .card{background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;margin-bottom:9px;cursor:pointer}
    .card:hover{border-color:var(--accent)}
    .card.on{ border-color:var(--accent2)}
    .crtop{display:flex;align-items:center;gap:7px;margin-bottom:7px}
    .cs{font-weight:700;font-size:14px}
    .air{font-size:11px;color:var(--muted);flex:1}
    .st{font-size:10px;padding:1px 7px;border-radius:9px}
    .st.air{background:rgba(35,201,160,.15);color:#4ee3bd}
    .st.ground{background:rgba(138,143,176,.15);color:var(--muted)}
    .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
    .cgrid div{font-size:11px}
    .cgrid label{display:block;font-size:10px;color:var(--muted)}
    .footer{flex:0 0 auto;padding:7px 18px;font-size:11px;color:var(--muted);background:var(--panel);border-top:1px solid var(--border)}
    @media(max-width:820px){.left{width:100%;flex-basis:auto;max-height:46vh;border-right:none;border-bottom:1px solid var(--border)}.layout{flex-direction:column}}
    /* Cesium 控件暗色化 */
    .cesium-viewer-bottom{display:none}
    .cesium-viewer-toolbar{top:12px;right:12px}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🌍</span>
      <div>
        <h1>3D 航班实时动态</h1>
        <p class="sub">冷链物流 · Cesium 3D 地球 · 基于 god-eye-view 渲染</p>
      </div>
    </div>
    <span class="badge">数据源：OpenSky（GitHub Actions 每15分钟）</span>
  </header>

  <div class="layout">
    <section class="left">
      <div class="search">
        <h2>查询航班 / 航司</h2>
        <div class="searchrow">
          <input id="q" placeholder="如 CCA1654 / 国航 / CCA / CSN" list="al">
          <button class="btn" id="go">查询</button>
        </div>
        <datalist id="al">
          <option value="CCA">国航 CA</option><option value="CSN">南航 CZ</option>
          <option value="CES">东航 MU</option><option value="CHH">海航 HU</option>
          <option value="CSC">川航 3U</option><option value="CSZ">深航 ZH</option>
          <option value="CXA">厦航 MF</option><option value="CDG">山航 SC</option>
        </datalist>
        <div class="hint">支持航班号(CCA1654)或航司(CCA/国航)。留空显全部。</div>
        <div class="refresh">
          <label><input type="checkbox" id="auto" checked> 每10秒刷新</label>
          <span class="gt" id="gen">—</span>
        </div>
        <div class="status" id="status">就绪，等待查询…</div>
      </div>
      <div class="results">
        <div class="reshead">
          <h2>匹配航班 <span class="cnt" id="count">0</span></h2>
          <button class="btn" id="clear" style="background:transparent;border:1px solid var(--border);color:var(--muted);padding:4px 9px;font-size:11px">清除选中</button>
        </div>
        <div class="list" id="list"><div class="empty">输入航班号或航司后查询<br>地图为 3D 地球，可拖拽/滚轮缩放</div></div>
      </div>
    </section>
    <section class="mapwrap">
      <div id="cesiumContainer"></div>
    </section>
  </div>

  <footer class="footer">
    3D 引擎：CesiumJS（god-eye-view 同款）· 飞机图标/机型分类移植自 <a href="https://github.com/bilawalsidhu/gods-eye-view" style="color:var(--accent2)" target="_blank" rel="noopener">gods-eye-view</a> · 底图：高德地图
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/cesium@1.124.0/Build/Cesium/Cesium.js"></script>
  <script src="../js/airlines.js"></script>
  <script>
    // airlines.js 是普通脚本(top-level const)，module 作用域不可见，显式挂到 window
    window.AIRLINE_KEYS = AIRLINE_KEYS;
    window.resolveAirlinePrefix = resolveAirlinePrefix;
    window.AIRLINES = AIRLINES;
  </script>
  <script src="../js/gev-icons.js" type="module"></script>
  <script src="../js/gev-class.js" type="module"></script>
  <script src="3d.js" type="module"></script>
</body>
</html>
