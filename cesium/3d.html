<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GOD'S EYE · 全球航班实时监视</title>
  <!-- Cesium 3D 引擎：本地 vendor 化，不依赖任何境外 CDN -->
  <link href="../vendor/cesium/Widgets/widgets.css" rel="stylesheet"
        onerror="this.onerror=null;this.href='https://registry.npmmirror.com/cesium/1.124.0/files/Build/Cesium/Widgets/widgets.css'">
  <style>
    /* ═══════════════════════════════════════════════════════
       设计语言移植自 gods-eye-view (MIT)
       "Dark Sci-Fi UI — Apple meets Blade Runner"
       ═══════════════════════════════════════════════════════ */
    :root {
      --bg-dark: #05060a;
      --glass-bg: rgba(10, 12, 20, 0.68);
      --glass-bg-strong: rgba(8, 10, 18, 0.86);
      --glass-border: rgba(255, 255, 255, 0.09);
      --glass-border-hi: rgba(0, 212, 255, 0.34);
      --accent: #00d4ff;
      --accent-dim: rgba(0, 212, 255, 0.14);
      --accent-glow: rgba(0, 212, 255, 0.42);
      --amber: #ffb020;
      --danger: #ff5b5b;
      --text-primary: #e8eaed;
      --text-secondary: rgba(232, 234, 237, 0.56);
      --text-dim: rgba(232, 234, 237, 0.3);
      --font-mono: 'SF Mono', 'JetBrains Mono', 'Roboto Mono', ui-monospace, Menlo, Consolas, monospace;
      --font-sans: Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --panel-radius: 16px;
      --btn-radius: 10px;
      --ease: 150ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }

    /* ── 全屏地球 ─────────────────────────────────────────── */
    #cesiumContainer { position: fixed; inset: 0; z-index: 0; }
    .cesium-widget canvas { outline: none; }
    /* 压暗 Cesium 自带控件，保留极简全屏按钮 */
    .cesium-viewer-bottom { display: none !important; }
    .cesium-viewer-toolbar { top: auto; bottom: 22px; right: 22px; }
    .cesium-button {
      background: rgba(10, 12, 20, 0.8) !important;
      border: 1px solid var(--glass-border) !important;
      border-radius: 10px !important;
      box-shadow: none !important;
      transition: var(--ease);
    }
    .cesium-button:hover { border-color: var(--glass-border-hi) !important; }

    /* 屏幕暗角 + 细扫描线，营造"监视感" */
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 45%, transparent 42%, rgba(0, 0, 0, 0.55) 100%),
        repeating-linear-gradient(0deg, rgba(0, 212, 255, 0.022) 0 1px, transparent 1px 3px);
    }

    /* ── 玻璃面板通用 ─────────────────────────────────────── */
    .glass {
      position: relative;
      background: var(--glass-bg);
      -webkit-backdrop-filter: blur(22px) saturate(170%);
      backdrop-filter: blur(22px) saturate(170%);
      border: 1px solid var(--glass-border);
      border-radius: var(--panel-radius);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.045);
    }
    /* 面板顶部一道青色高光 */
    .glass::before {
      content: ''; position: absolute; left: 14px; right: 14px; top: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5; pointer-events: none;
    }

    /* ── 顶部 HUD ─────────────────────────────────────────── */
    .hud-top {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; align-items: center; gap: 18px;
      padding: 10px 20px; white-space: nowrap;
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .eye {
      width: 26px; height: 26px; border-radius: 50%;
      border: 1px solid var(--accent);
      box-shadow: 0 0 12px var(--accent-glow), inset 0 0 8px var(--accent-dim);
      position: relative; flex: 0 0 auto;
    }
    .eye::after {
      content: ''; position: absolute; inset: 7px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
      animation: pulse 2.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.72); } }
    .brand-title { font-size: 14px; font-weight: 600; letter-spacing: 0.14em; }
    .brand-sub {
      font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em;
      color: var(--text-dim); margin-top: 2px;
    }
    .hud-sep { width: 1px; height: 26px; background: var(--glass-border); }
    .hud-stat { display: flex; flex-direction: column; gap: 3px; }
    .hud-stat .k {
      font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.12em;
      color: var(--text-dim); text-transform: uppercase;
    }
    .hud-stat .v { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
    .live-dot {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 8px var(--accent);
      margin-right: 6px; animation: pulse 1.8s ease-in-out infinite;
    }

    /* ── 左：搜索面板 ─────────────────────────────────────── */
    .panel-search {
      position: fixed; top: 86px; left: 22px; z-index: 10;
      width: 316px; padding: 16px;
    }
    .panel-label {
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.16em;
      color: var(--text-dim); text-transform: uppercase; margin-bottom: 11px;
    }
    .panel-label .tag { color: var(--accent); opacity: 0.85; }

    .search-row { display: flex; gap: 8px; }
    input[type=text] {
      flex: 1; min-width: 0;
      padding: 10px 12px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--glass-border);
      border-radius: var(--btn-radius);
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12.5px; letter-spacing: 0.02em;
      outline: none;
      transition: border-color var(--ease), box-shadow var(--ease);
    }
    input[type=text]::placeholder { color: var(--text-dim); }
    input[type=text]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-dim), 0 0 18px rgba(0, 212, 255, 0.18);
    }
    .btn {
      padding: 10px 16px; border: none; border-radius: var(--btn-radius);
      background: var(--accent); color: #04121a;
      font-family: var(--font-mono); font-size: 12px; font-weight: 700;
      letter-spacing: 0.08em; cursor: pointer;
      transition: var(--ease);
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
      white-space: nowrap;
    }
    .btn:hover { filter: brightness(1.12); box-shadow: 0 0 26px rgba(0, 212, 255, 0.5); }
    .btn:active { transform: translateY(1px); }

    .quick-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
    .chip {
      font-family: var(--font-mono); font-size: 10.5px;
      padding: 4px 9px; border-radius: 7px; cursor: pointer;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      color: var(--text-secondary);
      transition: var(--ease);
    }
    .chip:hover { border-color: var(--glass-border-hi); color: var(--accent); background: var(--accent-dim); }
    .chip.on { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }

    .meta-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 13px; padding-top: 11px;
      border-top: 1px solid var(--glass-border);
      font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary);
    }
    .meta-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    input[type=checkbox] {
      appearance: none; -webkit-appearance: none;
      width: 13px; height: 13px; border-radius: 4px;
      border: 1px solid var(--glass-border); background: rgba(0, 0, 0, 0.5);
      cursor: pointer; position: relative; transition: var(--ease);
    }
    input[type=checkbox]:checked { background: var(--accent); border-color: var(--accent); }
    input[type=checkbox]:checked::after {
      content: '✓'; position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 9px; font-weight: 900; color: #04121a;
    }
    .status-line {
      margin-top: 9px; font-family: var(--font-mono); font-size: 10.5px;
      line-height: 1.6; color: var(--text-dim); word-break: break-all;
    }
    .status-line.ok { color: var(--accent); }
    .status-line.err { color: var(--danger); }
    .status-line.load { color: var(--amber); }

    /* ── 右：航班列表 ─────────────────────────────────────── */
    .panel-list {
      position: fixed; top: 86px; right: 22px; z-index: 10;
      width: 330px; max-height: calc(100vh - 200px);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .list-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 10px; flex: 0 0 auto;
      border-bottom: 1px solid var(--glass-border);
    }
    .list-head .t { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; color: var(--text-dim); text-transform: uppercase; }
    .cnt {
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      padding: 2px 8px; border-radius: 20px;
      background: var(--accent-dim); color: var(--accent);
      border: 1px solid rgba(0, 212, 255, 0.3);
    }
    .list-body { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
    .list-body::-webkit-scrollbar { width: 5px; }
    .list-body::-webkit-scrollbar-thumb { background: rgba(0, 212, 255, 0.25); border-radius: 3px; }
    .list-body::-webkit-scrollbar-track { background: transparent; }

    .fcard {
      padding: 10px 12px; margin-bottom: 6px;
      border-radius: 11px; cursor: pointer;
      background: rgba(255, 255, 255, 0.028);
      border: 1px solid transparent;
      transition: var(--ease);
    }
    .fcard:hover { background: rgba(0, 212, 255, 0.07); border-color: rgba(0, 212, 255, 0.28); }
    .fcard.on {
      background: rgba(0, 212, 255, 0.11);
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(0, 212, 255, 0.16), inset 0 0 18px rgba(0, 212, 255, 0.05);
    }
    .fc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
    .fc-cs { font-family: var(--font-mono); font-size: 13.5px; font-weight: 700; letter-spacing: 0.04em; color: var(--text-primary); }
    .fcard.on .fc-cs { color: var(--accent); }
    .fc-air { font-size: 10.5px; color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fc-st {
      font-family: var(--font-mono); font-size: 8.5px; letter-spacing: 0.08em;
      padding: 1.5px 6px; border-radius: 5px; flex: 0 0 auto;
    }
    .fc-st.air { background: rgba(0, 212, 255, 0.13); color: var(--accent); }
    .fc-st.gnd { background: rgba(255, 255, 255, 0.06); color: var(--text-dim); }
    .fc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .fc-grid > div { display: flex; flex-direction: column; gap: 1px; }
    .fc-grid .k { font-size: 8.5px; color: var(--text-dim); letter-spacing: 0.04em; }
    .fc-grid .v { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
    .fcard.on .fc-grid .v { color: var(--text-primary); }

    .empty {
      padding: 30px 16px; text-align: center;
      font-family: var(--font-mono); font-size: 11px; line-height: 2;
      color: var(--text-dim);
    }

    /* ── 底部 HUD：坐标读数 ───────────────────────────────── */
    .hud-bottom {
      position: fixed; bottom: 18px; left: 22px; z-index: 10;
      display: flex; align-items: center; gap: 16px;
      padding: 9px 16px;
      font-family: var(--font-mono); font-size: 9.5px; letter-spacing: 0.1em;
      color: var(--text-dim); text-transform: uppercase;
    }
    .hud-bottom .val { color: var(--accent); letter-spacing: 0.04em; }

    .detail {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(10px);
      z-index: 11; width: min(620px, calc(100vw - 400px));
      padding: 0; overflow: hidden;
      opacity: 0; pointer-events: none;
      transition: opacity 220ms ease, transform 220ms ease;
    }
    .detail.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .dt-head {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--glass-border);
    }
    .dt-cs { font-family: var(--font-mono); font-size: 17px; font-weight: 700; color: var(--accent); letter-spacing: 0.05em; }
    .dt-air { font-size: 11px; color: var(--text-secondary); flex: 1; }
    .dt-close {
      width: 24px; height: 24px; border-radius: 7px; cursor: pointer;
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
      color: var(--text-secondary); font-size: 13px; line-height: 1;
      display: grid; place-items: center; transition: var(--ease);
    }
    .dt-close:hover { border-color: var(--danger); color: var(--danger); }
    .dt-body { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; padding: 14px 16px; }
    .dt-body .cell { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .dt-body .k { font-size: 8.5px; color: var(--text-dim); letter-spacing: 0.1em; text-transform: uppercase; }
    .dt-body .v { font-family: var(--font-mono); font-size: 12.5px; color: var(--text-primary); white-space: nowrap; }
    .dt-body .v small { font-size: 9px; color: var(--text-dim); }

    /* ── 启动遮罩 ─────────────────────────────────────────── */
    .boot {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center;
      background: var(--bg-dark);
      transition: opacity 500ms ease, visibility 500ms;
    }
    .boot.hide { opacity: 0; visibility: hidden; }
    .boot-inner { text-align: center; }
    .boot-title { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.3em; color: var(--accent); margin-top: 20px; }
    .boot-sub { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; color: var(--text-dim); margin-top: 8px; }
    .ring {
      width: 44px; height: 44px; margin: 0 auto; border-radius: 50%;
      border: 1px solid rgba(0, 212, 255, 0.18);
      border-top-color: var(--accent);
      animation: spin 900ms linear infinite;
      box-shadow: 0 0 22px rgba(0, 212, 255, 0.22);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── 响应式 ───────────────────────────────────────────── */
    @media (max-width: 1100px) {
      .panel-search { width: 260px; }
      .panel-list { width: 280px; }
      .detail { width: calc(100vw - 60px); }
      .hud-top .hud-stat { display: none; }
      .hud-sep { display: none; }
    }
    @media (max-width: 760px) {
      .panel-search { top: 74px; left: 12px; right: 12px; width: auto; }
      .panel-list {
        top: auto; bottom: 12px; left: 12px; right: 12px; width: auto;
        max-height: 34vh;
      }
      .hud-top { top: 10px; left: 12px; right: 12px; transform: none; padding: 8px 14px; }
      .hud-bottom { display: none; }
      .detail { bottom: auto; top: 196px; width: calc(100vw - 24px); }
      .dt-body { grid-template-columns: repeat(3, 1fr); }
      .quick-tags { display: none; }
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div class="vignette"></div>

  <!-- 顶部 HUD -->
  <header class="hud-top glass">
    <div class="brand">
      <div class="eye"></div>
      <div>
        <div class="brand-title">GOD'S EYE VIEW</div>
        <div class="brand-sub">GLOBAL FLIGHT SURVEILLANCE · 全球航班监视</div>
      </div>
    </div>
    <div class="hud-sep"></div>
    <div class="hud-stat">
      <span class="k">Tracked</span>
      <span class="v"><i class="live-dot"></i><span id="hudCount">0</span> 架</span>
    </div>
    <div class="hud-stat">
      <span class="k">Snapshot</span>
      <span class="v" id="hudTime">—</span>
    </div>
  </header>

  <!-- 左：搜索 -->
  <section class="panel-search glass">
    <div class="panel-label"><span>Target Acquisition</span><span class="tag">查询航班</span></div>
    <div class="search-row">
      <input id="q" type="text" placeholder="航班号 / 航司  如 CCA856" autocomplete="off" list="al">
      <button class="btn" id="go">锁定</button>
    </div>
    <datalist id="al">
      <option value="CCA">中国国际航空</option><option value="CSN">中国南方航空</option>
      <option value="CES">中国东方航空</option><option value="CHH">海南航空</option>
      <option value="CSC">四川航空</option><option value="CSZ">深圳航空</option>
      <option value="CXA">厦门航空</option><option value="CDG">山东航空</option>
      <option value="DKH">吉祥航空</option><option value="CPA">国泰航空</option>
    </datalist>
    <div class="quick-tags" id="quickTags">
      <span class="chip on" data-q="">全部</span>
      <span class="chip" data-q="CCA">国航</span>
      <span class="chip" data-q="CSN">南航</span>
      <span class="chip" data-q="CES">东航</span>
      <span class="chip" data-q="CHH">海航</span>
      <span class="chip" data-q="CPA">国泰</span>
    </div>
    <div class="meta-row">
      <label><input type="checkbox" id="auto" checked> 自动刷新</label>
      <span id="gen" style="color:var(--accent)">—</span>
    </div>
    <div class="status-line" id="status">初始化引擎…</div>
  </section>

  <!-- 右：列表 -->
  <section class="panel-list glass">
    <div class="list-head">
      <span class="t">Contacts <span class="cnt" id="count">0</span></span>
      <button class="btn" id="clear" style="background:transparent;border:1px solid var(--glass-border);color:var(--text-secondary);padding:4px 10px;font-size:10px;box-shadow:none">清除</button>
    </div>
    <div class="list-body" id="list">
      <div class="empty">正在接入 OpenSky 数据流…<br>拖拽旋转地球 · 滚轮缩放</div>
    </div>
  </section>

  <!-- 底部读数 -->
  <div class="hud-bottom glass">
    <span>LAT <span class="val" id="rLat">—</span></span>
    <span>LON <span class="val" id="rLon">—</span></span>
    <span>ALT <span class="val" id="rAlt">—</span></span>
    <span>FPS <span class="val" id="rFps">—</span></span>
  </div>

  <!-- 选中详情 -->
  <section class="detail glass" id="detail">
    <div class="dt-head">
      <span class="dt-cs" id="dtCs">—</span>
      <span class="dt-air" id="dtAir">—</span>
      <div class="dt-close" id="dtClose">✕</div>
    </div>
    <div class="dt-body" id="dtBody"></div>
  </section>

  <!-- 启动遮罩 -->
  <div class="boot" id="boot">
    <div class="boot-inner">
      <div class="ring"></div>
      <div class="boot-title">INITIALIZING</div>
      <div class="boot-sub">加载 3D 地球引擎与航班数据…</div>
    </div>
  </div>

  <script>
    // Cesium 本地 vendor：零外部 CDN 依赖，避免 jsdelivr/unpkg 在国内不可达
    window.CESIUM_BASE_URL = "../vendor/cesium/";
  </script>
  <script src="../vendor/cesium/Cesium.js"></script>
  <script>
    // 兜底：本地 vendor 未上传/加载失败时，回退 npmmirror 国内镜像
    // （jsdelivr、unpkg、cdnjs 在国内基本不可达，不要再用）
    if (!window.Cesium) {
      window.CESIUM_BASE_URL = "https://registry.npmmirror.com/cesium/1.124.0/files/Build/Cesium/";
      document.write('<script src="' + window.CESIUM_BASE_URL + 'Cesium.js"><\/script>');
    }
  </script>
  <script src="../js/airlines.js"></script>
  <script>
    window.AIRLINE_KEYS = AIRLINE_KEYS;
    window.resolveAirlinePrefix = resolveAirlinePrefix;
    window.airlineName = airlineName;
  </script>
  <script type="module" src="../js/gev-icons.js"></script>
  <script type="module" src="../js/gev-class.js"></script>
  <script type="module" src="3d.js"></script>
</body>
</html>
